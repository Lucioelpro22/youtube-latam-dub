name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r backend/requirements.txt httpx
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: node --test tests/sync.test.cjs
